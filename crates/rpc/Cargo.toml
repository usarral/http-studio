[package]
name = "http-studio-rpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
futures-util = "0.3.34"
http-studio-application = { version = "0.1.0", path = "../application" }
http-studio-domain = { version = "0.1.0", path = "../domain" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "io-util", "sync", "macros"] }

[dev-dependencies]
async-stream = "0.3.6"
async-trait = "0.1.92"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-util", "time"] }
